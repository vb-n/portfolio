<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dr. Veera Naidu is a platform engineering leader focused on developer experience, cloud-native platforms, and reliable infrastructure.">
  <meta name="author" content="Dr. Veera Naidu">
  <meta property="og:title" content="Dr. Veera Naidu | Platform Engineering">
  <meta property="og:description" content="Platform engineering, developer experience, and cloud-native infrastructure.">
  <meta property="og:type" content="website">
  <title>Dr. Veera Naidu | Platform Engineering</title>
  <link rel="stylesheet" href="css/k8s.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="wordmark" href="#top">Veera Naidu</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#experience">Experience</a>
        <a href="#education">Education</a>
      </nav>
    </header>

    <main id="top">
      <div id="loadingMessage" class="loading-message" role="status">Loading portfolio…</div>
      <div id="loadError" class="load-error" role="alert" hidden></div>
      <div id="portfolioContent" hidden>
        <section class="intro" aria-labelledby="candidateName">
          <p class="eyebrow">Platform engineering · Developer experience · Cloud-native systems</p>
          <h1 id="candidateName"></h1>
          <p id="candidateHeadline" class="headline"></p>
          <p id="summaryText" class="summary"></p>
          <div id="contactActions" class="link-row"></div>
        </section>

        <section class="section" aria-labelledby="skillsTitle">
          <h2 id="skillsTitle">Areas of focus</h2>
          <div id="skillsGrid" class="skills-list"></div>
        </section>

        <section id="experience" class="section" aria-labelledby="experienceTitle">
          <h2 id="experienceTitle">Experience</h2>
          <div id="experienceTimeline"></div>
        </section>

        <section id="education" class="section" aria-labelledby="educationTitle">
          <h2 id="educationTitle">Education</h2>
          <div id="educationList"></div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <span id="footerName"></span>
      <a href="#top">Back to top ↑</a>
    </footer>
  </div>
</body>
</html>
